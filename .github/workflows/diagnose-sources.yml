name: Diagnose data sources

# Manual connectivity check from a GitHub runner to every data source:
# status, timing, and the start of each response body (to tell JSON from block pages).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ vars.PITCHIQ_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Probe sources
        run: |
          UA="PitchIQ-portfolio-bot/0.1 (+https://github.com/NiKeT972/top5-football-analytics)"
          JAR=$(mktemp)
          probe() {
            local url="$1"; shift
            local body; body=$(mktemp)
            local meta; meta=$(curl -4 -s -L -c "$JAR" -b "$JAR" -A "$UA" "$@" -m 25 -o "$body" \
              -w "%{http_code} %{content_type} %{size_download}B %{time_total}s" "$url" 2>&1) || true
            echo "=== $url -> $meta"
            head -c 300 "$body" | tr '\n' ' '; echo; echo
          }
          probe https://understat.com/
          probe https://understat.com/getLeagueData/EPL/2025 -H "X-Requested-With: XMLHttpRequest" -H "Referer: https://understat.com/league/EPL/2025"
          probe https://understat.com/league/EPL/2025
          probe https://www.football-data.co.uk/mmz4281/2526/E0.csv
          probe http://api.clubelo.com/2025-11-01
          echo "--- runner egress IP"; curl -s -m 10 https://api.ipify.org || true
