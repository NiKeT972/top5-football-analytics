name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --python 3.11
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
  # Web lint + tests (eslint, vitest) are added in Phase 6.
