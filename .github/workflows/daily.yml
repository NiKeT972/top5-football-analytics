name: Daily pipeline

# 06:07 IST = 00:37 UTC (offset from the top of the hour, when GitHub queues are busiest).
on:
  schedule:
    - cron: "37 0 * * *"
  workflow_dispatch:
    inputs:
      max_match_requests:
        description: "Cap on per-match Understat requests (0 = config default; use for backfill)"
        default: "0"
      skip_models:
        description: "Only ingest + validate"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pitchiq-data
  cancel-in-progress: false

env:
  PITCHIQ_DATA_DIR: ${{ github.workspace }}/pipeline/data
  UV_SYSTEM_CERTS: "1"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.11

      # The processed Parquet store lives in the Actions cache between runs (see docs/runbook.md).
      - name: Restore data store
        uses: actions/cache/restore@v4
        with:
          path: pipeline/data
          key: pitchiq-data-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pitchiq-data-v1-

      - name: Ingest (incremental)
        id: ingest
        run: uv run pitchiq ingest --max-match-requests ${{ inputs.max_match_requests || 0 }}

      - name: Validate
        id: validate
        if: ${{ !cancelled() }}
        run: uv run pitchiq validate

      - name: Data profile
        if: ${{ !cancelled() }}
        run: uv run pitchiq profile

      # Saved even when a step failed: ingestion only ever writes fully parsed data,
      # so partial backfill progress is valid and must not be lost.
      - name: Save data store
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: pipeline/data
          key: pitchiq-data-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit freshness file
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          git config user.name "pitchiq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-freshness.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((i*5)); done

      - name: Fail if ingestion or validation failed
        if: ${{ steps.ingest.outcome == 'failure' || steps.validate.outcome == 'failure' }}
        run: exit 1
