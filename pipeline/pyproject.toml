[project]
name = "pitchiq"
version = "0.1.0"
description = "Data pipeline and ML models for PitchIQ: football analytics for Europe's top 5 leagues."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "statsmodels>=0.14",
    "soccerdata>=1.8",
    "rapidfuzz>=3.9",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pandera>=0.20",
    "pyyaml>=6.0",
    "typer>=0.12",
    "shap>=0.46",
    "matplotlib>=3.9",
]

[project.scripts]
pitchiq = "pitchiq.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitchiq"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "D", "PD", "NPY"]
ignore = ["D203", "D213", "D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
